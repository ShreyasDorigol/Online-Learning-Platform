<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — Learnweb</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">Learnweb</a>
  <div class="nav-links"><a href="/courses">Courses</a></div>
</nav>

<div class="form-page">
  <div class="form-box">
    <h2>Learnweb</h2>
    <p class="sub">Sign in or create an account</p>

    <div class="tabs">
      <button class="tab-btn active" id="btn-login" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="btn-register" onclick="switchTab('register')">Register</button>
    </div>

    <div class="alert alert-error" id="err-invalid">Incorrect email or password.</div>
    <div class="alert alert-error" id="err-exists">Email already registered.</div>
    <div class="alert alert-success" id="msg-registered">Account created! Sign in below.</div>

    <!-- SIGN IN -->
    <div id="tab-login" class="tab-panel active">
      <form action="/api/auth/login" method="post">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@example.com" required/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="Password" required/>
        </div>
        <button type="submit" class="btn btn-primary w-full">Sign In</button>
      </form>
    </div>

    <!-- REGISTER -->
    <div id="tab-register" class="tab-panel">
      <form action="/api/auth/register" method="post">
        <div class="form-group">
          <label>Name</label>
          <input type="text" name="name" placeholder="Your name" required/>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@example.com" required/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="Min 6 characters" required minlength="6"/>
        </div>
        <button type="submit" class="btn btn-primary w-full">Create Account</button>
      </form>
    </div>

    <div class="form-footer"><a href="/">← Back to home</a></div>
  </div>
</div>

<script>
  function switchTab(tab) {
    ['login','register'].forEach(t => {
      document.getElementById('tab-' + t).classList.toggle('active', t === tab);
      document.getElementById('btn-' + t).classList.toggle('active', t === tab);
    });
  }
  const p = new URLSearchParams(location.search);
  if (p.get('error') === 'true')   document.getElementById('err-invalid').classList.add('show');
  if (p.get('error') === 'exists') { document.getElementById('err-exists').classList.add('show'); switchTab('register'); }
  if (p.get('registered'))         document.getElementById('msg-registered').classList.add('show');
  if (p.get('tab') === 'register') switchTab('register');
</script>
</body>
</html>
