<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${course.title} + ' — LearnForge'">Course</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">LearnForge</a>
  <div class="nav-links">
    <a href="/courses">← Courses</a>
    <th:block th:if="${session.user != null}">
      <a href="/dashboard">Dashboard</a>
      <a href="/api/auth/logout">Sign Out</a>
    </th:block>
    <th:block th:unless="${session.user != null}">
      <a href="/login">Sign In</a>
    </th:block>
  </div>
</nav>

<div class="detail-layout">

  <!-- LEFT -->
  <div>
    <div class="detail-card" style="margin-bottom:16px;">
      <h1 th:text="${course.title}">Course Title</h1>
      <p th:text="${course.description}">Description</p>
    </div>

    <div style="font-size:0.875rem;font-weight:bold;margin-bottom:8px;">
      Lessons <span style="font-weight:normal;color:#888;" th:text="'(' + ${lessons.size()} + ')'"></span>
    </div>

    <div class="lesson-list">
      <p th:if="${#lists.isEmpty(lessons)}" style="color:#888;font-size:0.875rem;">No lessons yet.</p>
      <a class="lesson-item"
         th:each="lesson, i : ${lessons}"
         th:classappend="${completedLessonIds != null and completedLessonIds.contains(lesson.id)} ? ' done'"
         th:href="@{/complete/{lid}(lid=${lesson.id}, courseId=${course.id})}">
        <div class="lesson-num"
             th:text="${completedLessonIds != null and completedLessonIds.contains(lesson.id)} ? '✓' : ${i.count}">1</div>
        <div>
          <div class="lesson-title" th:text="${lesson.title}">Title</div>
          <div class="lesson-preview" th:text="${#strings.abbreviate(lesson.content, 70)}">Preview</div>
        </div>
        <span class="lesson-check" th:if="${completedLessonIds != null and completedLessonIds.contains(lesson.id)}">✓</span>
      </a>
    </div>
  </div>

  <!-- RIGHT -->
  <div>
    <div class="sidebar-card">
      <h3>Progress</h3>

      <div th:if="${session.user != null and enrolled}">
        <div class="progress-pct" th:text="${progress} + '%'">0%</div>
        <div class="progress-bar">
          <div class="progress-fill" th:style="'width:' + ${progress} + '%'"></div>
        </div>
        <hr/>
        <div class="sidebar-row"><span>Total</span><span th:text="${lessons.size()}">0</span></div>
        <div class="sidebar-row"><span>Done</span><span th:text="${completedCount}">0</span></div>
        <div class="sidebar-row"><span>Left</span><span th:text="${lessons.size() - completedCount}">0</span></div>
        <hr/>
        <p style="font-size:0.78rem;color:#888;">Click a lesson to mark it complete.</p>
      </div>

      <div th:unless="${session.user != null and enrolled}">
        <p style="font-size:0.85rem;color:#666;margin-bottom:12px;">Enroll to track your progress.</p>
        <form th:if="${session.user != null}" th:action="@{/enroll/{id}(id=${course.id})}" method="post">
          <button type="submit" class="btn btn-primary w-full">Enroll Now</button>
        </form>
        <a th:unless="${session.user != null}" href="/login" class="btn btn-primary w-full">Sign In to Enroll</a>
      </div>
    </div>
  </div>

</div>

<footer>
  <span>LearnForge</span><span>© 2025</span>
</footer>
</body>
</html>
