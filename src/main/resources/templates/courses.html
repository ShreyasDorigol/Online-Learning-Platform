<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Courses — Learnweb</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">Learnweb</a>
  <div class="nav-links">
    <a href="/courses">Courses</a>
    <th:block th:if="${session.user != null}">
      <a href="/dashboard">Dashboard</a>
      <a href="/admin">Admin</a>
      <a href="/api/auth/logout">Sign Out</a>
    </th:block>
    <th:block th:unless="${session.user != null}">
      <a href="/login">Sign In</a>
      <a href="/login?tab=register" class="btn btn-primary btn-sm">Register</a>
    </th:block>
  </div>
</nav>

<div class="page-header">
  <h1>All Courses</h1>
  <p th:if="${session.user != null}" th:text="'Logged in as ' + ${session.user.name}">Welcome</p>
  <p th:unless="${session.user != null}">Sign in to enroll and track your progress.</p>
</div>

<div class="container">
  <div class="course-grid">
    <div class="course-card" th:each="course : ${courses}">
      <h3 th:text="${course.title}">Title</h3>
      <p th:text="${course.description}">Description</p>
      <div class="course-card-footer">
        <span>Self-paced</span>
        <a th:href="@{/course/{id}(id=${course.id})}" class="btn btn-primary btn-sm">View</a>
      </div>
    </div>
    <div th:if="${#lists.isEmpty(courses)}" style="grid-column:1/-1;text-align:center;padding:40px;color:#888;">
      No courses yet. <a href="/admin">Add from admin →</a>
    </div>
  </div>
</div>

<footer>
  <span>Learnweb</span><span>© 2025</span>
</footer>
</body>
</html>
